# trigger: scan public mirrors for exact uploaded snapshot
name: Import hk4e-go source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-hk4e-go.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find exact matching mirror
        shell: bash
        run: |
          set -euo pipefail
          expected_count='33833'
          expected_total='274674718'
          expected_digest='eec3053400011b31ddc8bb7e9f4c5abde0831bbca5c3df308501005b5569cd7f'

          candidates=(
            'https://github.com/Kei-Luna/hk4e-go.git'
            'https://github.com/qinfyy/hk4e-go-backup.git'
            'https://github.com/7z520/hk4e-go.git'
            'https://github.com/guyuqaq/hk4e-go.git'
            'https://github.com/gucooing/hk4e-go.git'
            'https://github.com/Akiko97/hk4e-go.git'
            'https://github.com/Xiaobin0860/hk4e-go.git'
            'https://github.com/mcxa8/hk4e-go.git'
            'https://github.com/flymoonvip/hk4e-go-server.git'
            'https://github.com/Peruere-dev/hk4e_go.git'
            'https://github.com/javalangexception/hk4e-1-GO.git'
            'https://github.com/czcawfi/hk4e-go-bx.git'
            'https://github.com/AUndead/hk4e-go-bx.git'
            'https://github.com/PangBai-x/hk4e-go-bx.git'
            'https://github.com/Fork-HongchengQ/hk4e-go-fork.git'
          )

          rm -rf /tmp/hk4e-match /tmp/hk4e-candidate
          matched=''

          for url in "${candidates[@]}"; do
            echo "=== checking $url ==="
            rm -rf /tmp/hk4e-candidate
            if ! git clone --depth 1 --quiet "$url" /tmp/hk4e-candidate; then
              echo "clone failed: $url"
              continue
            fi

            read -r count total digest < <(python3 - <<'PY'
          import os, hashlib
          rows=[]
          count=0
          total=0
          root='/tmp/hk4e-candidate'
          for dp,dns,fns in os.walk(root):
              if '.git' in dns:
                  dns.remove('.git')
              for fn in fns:
                  p=os.path.join(dp,fn)
                  rel=os.path.relpath(p,root).replace(os.sep,'/')
                  h=hashlib.sha256()
                  with open(p,'rb') as f:
                      while True:
                          b=f.read(1024*1024)
                          if not b:
                              break
                          h.update(b)
                  rows.append(f'{rel}\t{h.hexdigest()}\n')
                  count += 1
                  total += os.path.getsize(p)
          rows.sort()
          digest=hashlib.sha256(''.join(rows).encode()).hexdigest()
          print(count, total, digest)
          PY
            )
            echo "count=$count total=$total digest=$digest"

            if [ "$count" = "$expected_count" ] && [ "$total" = "$expected_total" ] && [ "$digest" = "$expected_digest" ]; then
              echo "EXACT MATCH: $url"
              mv /tmp/hk4e-candidate /tmp/hk4e-match
              matched="$url"
              break
            fi
          done

          if [ -z "$matched" ]; then
            echo 'No exact HEAD snapshot found in candidate mirrors' >&2
            exit 1
          fi

          echo "MATCH_URL=$matched" >> "$GITHUB_ENV"

      - name: Import exact verified snapshot
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/hk4e-match/ "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Import verified hk4e-go source snapshot from ${MATCH_URL}"
          git push origin HEAD:main
