name: Import hk4e-go source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-hk4e-go.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone verified source mirror
        run: |
          set -euo pipefail
          rm -rf /tmp/hk4e-source
          git clone --depth 1 https://github.com/qinfyy/hk4e-go-backup.git /tmp/hk4e-source

      - name: Verify exact uploaded ZIP contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, hashlib, sys
          root='/tmp/hk4e-source'
          rows=[]
          count=0
          total=0
          for dp,dns,fns in os.walk(root):
              if '.git' in dns:
                  dns.remove('.git')
              for fn in fns:
                  p=os.path.join(dp,fn)
                  rel=os.path.relpath(p,root).replace(os.sep,'/')
                  h=hashlib.sha256()
                  with open(p,'rb') as f:
                      while True:
                          b=f.read(1024*1024)
                          if not b:
                              break
                          h.update(b)
                  rows.append(f'{rel}\t{h.hexdigest()}\n')
                  count += 1
                  total += os.path.getsize(p)
          rows.sort()
          digest=hashlib.sha256(''.join(rows).encode()).hexdigest()
          print('COUNT', count)
          print('TOTAL', total)
          print('CONTENT_MANIFEST_SHA256', digest)
          expected=(33833, 274674718, '0406b9fac1cdc350e2d17e915f995a789d31f9fac0f7c529087cfd7e51d817b3')
          if (count,total,digest) != expected:
              print('Source does not match uploaded ZIP', file=sys.stderr)
              sys.exit(1)
          print('Exact uploaded ZIP content verified')
          PY

      - name: Import verified snapshot
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/hk4e-source/ "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import hk4e-go source snapshot'
          git push origin HEAD:main
