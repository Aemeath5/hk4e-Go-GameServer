# trigger: full content fingerprint verification
name: Import hk4e-go source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-hk4e-go.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone matching backup candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/hk4e-upstream
          git clone --depth 1 https://github.com/qinfyy/hk4e-go-backup.git /tmp/hk4e-upstream

      - name: Verify complete content fingerprint
        run: |
          set -euo pipefail
          cd /tmp/hk4e-upstream
          python3 - <<'PY'
          import os, hashlib, sys
          rows=[]
          count=0
          total=0
          for dp,dns,fns in os.walk('.'):
              if '.git' in dns:
                  dns.remove('.git')
              for fn in fns:
                  p=os.path.join(dp,fn)
                  rel=os.path.relpath(p,'.').replace(os.sep,'/')
                  h=hashlib.sha256()
                  with open(p,'rb') as f:
                      while True:
                          b=f.read(1024*1024)
                          if not b:
                              break
                          h.update(b)
                  rows.append(f'{rel}\t{h.hexdigest()}\n')
                  count += 1
                  total += os.path.getsize(p)
          rows.sort()
          digest=hashlib.sha256(''.join(rows).encode()).hexdigest()
          print('COUNT', count)
          print('TOTAL', total)
          print('CONTENT_MANIFEST_SHA256', digest)
          expected_count=33833
          expected_total=274674718
          expected_digest='eec3053400011b31ddc8bb7e9f4c5abde0831bbca5c3df308501005b5569cd7f'
          if (count,total,digest)!=(expected_count,expected_total,expected_digest):
              print('Snapshot content does not exactly match uploaded archive', file=sys.stderr)
              sys.exit(1)
          print('All 33,833 file paths and contents match uploaded archive exactly')
          PY

      - name: Import verified source snapshot
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/hk4e-upstream/ "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified hk4e-go source snapshot'
          git push origin HEAD:main
